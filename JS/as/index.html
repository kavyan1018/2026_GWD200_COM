<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- <script src="./1.js"></script> -->
    <script src="./api.js"></script>

</head>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;

        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;
        margin: 0;
    }

    .container {
        background: white;
        width: 400px;
        padding: 30px;

        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;

        margin-bottom: 18px;

        border: 1px solid #ccc;
        border-radius: 6px;

        font-size: 16px;
    }

    input:focus {
        border-color: #007bff;
        outline: none;
    }

    button {
        width: 100%;
        padding: 12px;

        background: #007bff;
        color: white;

        border: none;
        border-radius: 6px;

        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #0056b3;
    }
</style>

<body>

    <h2>Enter Product Details</h2>

    <form id="productForm">

        <label for="productName">Product Name:</label>
        <input type="text" id="productName" required>
        <br><br>

        <label for="productId">Product ID:</label>
        <input type="number" id="productId" required>
        <br><br>

        <label for="productPrice">Product Price:</label>
        <input type="number" id="productPrice" required>
        <br><br>

        <button type="button" onclick="SendData()">Add Product</button>

    </form>


</body>

</html>
